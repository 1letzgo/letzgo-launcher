[versions]
# Alpha-BOM, weil AOSP Material3-Expressive-APIs nutzt, die in stable noch internal sind
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
compose-bom = "2026.10.01"
dagger = "2.60.1"
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
coroutines = "1.11.0"
lifecycle = "2.11.0"
appfunctions = "1.0.0-beta01"

[libraries]
androidx-annotation = "androidx.annotation:annotation:1.11.0"
androidx-core = "androidx.core:core-ktx:1.19.1"
androidx-core-animation = "androidx.core:core-animation:1.0.0"
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.2"
androidx-recyclerview = "androidx.recyclerview:recyclerview:1.4.0"
androidx-dynamicanimation = "androidx.dynamicanimation:dynamicanimation:1.1.0"
androidx-fragment = "androidx.fragment:fragment-ktx:1.9.1"
androidx-preference = "androidx.preference:preference-ktx:1.2.1"
androidx-slice-view = "androidx.slice:slice-view:1.0.0"
androidx-cardview = "androidx.cardview:cardview:1.0.0"
androidx-window = "androidx.window:window:1.5.1"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
androidx-lifecycle-extensions = "androidx.lifecycle:lifecycle-extensions:2.2.0"
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-navigation-compose = "androidx.navigation:navigation-compose:2.10.2"
material = "com.google.android.material:material:1.14.0"
compose-bom = { module = "androidx.compose:compose-bom-alpha", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
javax-inject = "javax.inject:javax.inject:1"
guava = "com.google.guava:guava:33.7.2-android"
jsr305 = "com.google.code.findbugs:jsr305:3.0.2"
androidx-graphics-shapes = "androidx.graphics:graphics-shapes:1.1.0"
junit = "junit:junit:4.13.2"
org-json = "org.json:json:20260814"
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

androidx-appfunctions = { module = "androidx.appfunctions:appfunctions", version.ref = "appfunctions" }
androidx-appfunctions-service = "androidx.appfunctions:appfunctions-service:1.0.0-alpha09"
androidx-appfunctions-compiler = { module = "androidx.appfunctions:appfunctions-compiler", version.ref = "appfunctions" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
